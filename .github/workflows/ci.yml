name: Player Lab CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Typecheck, lint, contracts, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Wyzie server-boundary contract
        run: python3 tests/test_wyzie_live_server_boundary.py

      - name: Local media-library contract
        run: python3 tests/test_local_media_library_contract.py

      - name: Production build
        run: npm run build
